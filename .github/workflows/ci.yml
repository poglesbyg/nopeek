name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_FROZEN: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --python ${{ matrix.python-version }}
      - run: uv run pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  oldest-supported:
    # The floor in pyproject is a promise; this is the test of it. Installed
    # without pandas-stubs, whose own pins would drag pandas back up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.10
      - run: uv pip install -e . pytest hypothesis tomli "pandas==1.5.3" "numpy==1.23.5"
      - run: uv run --no-sync pytest

  survey-calibration:
    # The survey harness reports a reassuring leak rate of zero when it is
    # broken, so CI runs its two calibration targets: one must come back clean,
    # the other must come back leaking, or the job fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --python 3.12
      - run: uv run python -m survey --only calibration/clean calibration/leaky --out survey-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survey-results
          path: survey-results/
