name: release

# Two ways in:
#
#   a published GitHub Release -> builds the tagged version and uploads it
#   workflow_dispatch          -> rehearsal; proves the trusted-publishing
#                                 handshake works without publishing anything
#
# Both go to PyPI and both use the same OIDC identity, so a green rehearsal
# means a real release will authenticate. The rehearsal refuses to run unless
# the version it built is already on PyPI, so it cannot become a back door for
# publishing something unreviewed.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Never ship something the suite has not passed on.
      - run: uv sync --extra dev --python 3.12
      - run: uv run pytest

      # The 0.1.1 release went out five times because a stale checkout kept
      # building the previous version. CI cannot be stale, but tagging v0.1.2
      # while pyproject still says 0.1.1 would publish the wrong thing under the
      # right name, so the two are checked against each other here.
      - name: Version matches the release tag
        if: github.event_name == 'release'
        run: |
          version=$(uv run python -c \
            "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject: $version    tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::pyproject version $version does not match release tag $tag"
            exit 1
          fi

      - run: uv build
      - run: uv run --with "twine>=6.1" twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no
      # API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # A dispatch is a rehearsal. If the built version is not already on PyPI
      # then uploading it would be a real release that nobody tagged or
      # reviewed, so stop instead.
      - name: A rehearsal may not publish anything new
        if: github.event_name == 'workflow_dispatch'
        run: |
          version=$(basename dist/*.whl | cut -d- -f2)
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/nopeek/${version}/json")
          echo "nopeek ${version} on PyPI -> HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::version ${version} is not on PyPI, so this dispatch would publish it. Cut a GitHub Release instead."
            exit 1
          fi
          echo "Already published, so the upload below will skip the files and"
          echo "only the trusted-publishing handshake is exercised."

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # On a rehearsal the files are already on PyPI and are skipped, which
          # is what makes the run green. On a real release nothing is skipped,
          # and a duplicate is an error, as it should be.
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
