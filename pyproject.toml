[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nopeek"
version = "0.1.0"
description = "Verify that a data pipeline never reads the future"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Paul Greenwood", email = "poglesbyg@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "data-leakage",
    "lookahead-bias",
    "point-in-time",
    "time-series",
    "backtesting",
    "machine-learning",
    "pytest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://github.com/poglesbyg/nopeek"
Repository = "https://github.com/poglesbyg/nopeek"
Issues = "https://github.com/poglesbyg/nopeek/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "tomli>=2.0; python_version < '3.11'",
    "hypothesis>=6.90",
    "mypy>=1.8",
    "ruff>=0.5",
    "pandas-stubs",
]

[project.entry-points.pytest11]
nopeek = "nopeek.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nopeek = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.mypy]
# 3.12 rather than the 3.10 floor: numpy's stubs use PEP 695 `type` statements,
# which mypy refuses to parse when asked to analyse as an older Python, and
# skipping those stubs would lose most of what type-checking this code buys.
# The floor is guarded by actually running the suite on 3.10 in CI, which is a
# stronger check than a static approximation of it anyway.
python_version = "3.12"
mypy_path = "src:."
packages = ["nopeek", "survey"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The survey imports its targets' code, which is not installed here by design.
module = ["sepsis.*", "tomli"]
ignore_missing_imports = true
