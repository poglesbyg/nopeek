name = "poglesbyg/sepsis-early-warning"
description = """ICU early-warning features: LOCF, recency, rolling windows, clinical scores. Reports a leak, and the project agrees: rolling_summaries rolls the whole patient-sorted array in one pass, so pandas' accumulator carries state across admission boundaries. Around 1e-7 on real values; tracked upstream as a strict xfail."""
url = "https://github.com/poglesbyg/sepsis-early-warning"
expect = "leaks"
category = "project"

[source]
kind = "git"
url = "https://github.com/poglesbyg/sepsis-early-warning"
subdir = "src"

[entry]
pipeline = "sepsis.features:build_features"
data = "survey.fixtures:sepsis_stays"

[roles]
time = "hour"
group = "patient_id"
ignore = ["SepsisLabel"]
preserve = ["Age", "Gender", "Unit1", "Unit2", "HospAdmTime"]

[limits]
timeout_seconds = 900
